<div class="layout">
  <header class="layout__header">
    <button
      type="button"
      class="layout__toggle"
      (click)="toggleSidebar()"
      aria-label="Alternar sidebar"
    >
      <i class="pi pi-bars"></i>
    </button>

    <a routerLink="/" class="layout__brand">Arquitetura Angular</a>

    <span class="layout__user">{{ userName }}</span>
  </header>

  <div class="layout__body">
    <aside class="layout__sidebar" [class.is-collapsed]="!isSidebarOpen">
      <app-sidebar-layout />
    </aside>

    <main class="layout__content">
      <router-outlet />
    </main>
  </div>
</div>
